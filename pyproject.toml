[build-system]
requires = ["setuptools>=68,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-robot"
version = "2.0.0"
description = "Clean local multi-market quantitative research and paper-trading framework (research-to-paper only)."
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.0,<3.1",
  "pydantic>=2.0,<3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=15,<25"]
reports = ["matplotlib>=3.8,<4"]
data = ["tushare>=1.4,<2", "yfinance>=0.2,<2", "akshare>=1.15,<2", "ccxt>=4.0,<5", "requests>=2.31,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quant_robot.gui" = ["static/*"]
