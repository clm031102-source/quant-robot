name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-ci.txt

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/constraints-ci.txt build wheel
          python -m pip install -c requirements/constraints-ci.txt -e ".[parquet,reports]"
          python -m pip check

      - name: Build wheel
        run: python -m build --wheel

      - name: Run full verification suite
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/run_checks.py
