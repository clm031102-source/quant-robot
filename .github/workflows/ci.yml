name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/constraints-ci.txt

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/constraints-ci.txt build wheel
          python -m pip install -c requirements/constraints-ci.txt -e ".[parquet,reports]"
          python -m pip check

      - name: Build wheel
        run: python -m build --wheel

      - name: Run tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Compile Python
        env:
          PYTHONPATH: src
        run: python -m compileall -q src scripts tests

      - name: Project audit
        env:
          PYTHONPATH: src
        run: |
          python scripts/run_project_audit.py --json > project_audit.json
          python -c "import json, pathlib, sys; audit=json.loads(pathlib.Path('project_audit.json').read_text(encoding='utf-8')); print(json.dumps(audit['summary'], sort_keys=True)); sys.exit(0 if audit['summary']['passes'] else 1)"
